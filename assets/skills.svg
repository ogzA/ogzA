<?xml version="1.0" encoding="UTF-8"?>
<svg width="860" height="472" viewBox="0 0 860 472" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Skill monitor">
  <defs>
    <linearGradient id="accentLine2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4AF2C8" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#4AF2C8"/>
      <stop offset="0.75" stop-color="#FFC46B"/>
      <stop offset="1" stop-color="#FFC46B" stop-opacity="0"/>
    </linearGradient>
    <pattern id="seg" width="10" height="13" patternUnits="userSpaceOnUse">
      <rect x="8" width="2" height="13" fill="#0D1117"/>
    </pattern>
    <pattern id="scan2" width="6" height="4" patternUnits="userSpaceOnUse">
      <rect width="6" height="1" fill="#FFFFFF" fill-opacity="0.02"/>
    </pattern>
  </defs>

  <style><![CDATA[
    text { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace; }
    .dim{fill:#8B949E}.fg{fill:#E6EDF3}.mint{fill:#4AF2C8}.amber{fill:#FFC46B}.ice{fill:#79C0FF}

    .bar {
      transform-box: fill-box;
      transform-origin: 0% 50%;
      transform: scaleX(0);
      animation: grow 0.95s cubic-bezier(.25,.8,.3,1) forwards;
    }
    @keyframes grow { to { transform: scaleX(1); } }
    .b0{animation-delay:.30s}.b1{animation-delay:.42s}.b2{animation-delay:.54s}.b3{animation-delay:.66s}
    .b4{animation-delay:.78s}.b5{animation-delay:.90s}.b6{animation-delay:1.02s}.b7{animation-delay:1.14s}

    .pct { opacity:0; animation: fadeIn .45s ease-out forwards; }
    .p0{animation-delay:1.05s}.p1{animation-delay:1.17s}.p2{animation-delay:1.29s}.p3{animation-delay:1.41s}
    .p4{animation-delay:1.53s}.p5{animation-delay:1.65s}.p6{animation-delay:1.77s}.p7{animation-delay:1.89s}
    .stat { opacity:0; animation: fadeIn .6s ease-out 2.1s forwards; }
    .stat2 { opacity:0; animation: fadeIn .6s ease-out 2.35s forwards; }
    @keyframes fadeIn { to { opacity:1; } }
  ]]></style>

  <!-- window shell -->
  <rect x="6" y="6" width="848" height="460" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>

  <!-- title bar -->
  <circle cx="34" cy="32" r="7" fill="#FF5F57"/>
  <circle cx="58" cy="32" r="7" fill="#FEBC2E"/>
  <circle cx="82" cy="32" r="7" fill="#28C840"/>
  <text x="430" y="37" text-anchor="middle" font-size="13" class="dim">oguz@akankan: top · skill monitor</text>
  <line x1="7" y1="58" x2="853" y2="58" stroke="#21262D" stroke-width="1"/>
  <rect x="7" y="58" width="846" height="2" fill="url(#accentLine2)" opacity="0.55"/>
  <rect x="8" y="60" width="844" height="404" fill="url(#scan2)"/>

  <!-- column header -->
  <text x="46" y="96" font-size="12" class="dim" opacity="0.8">SKILL</text>
  <text x="312" y="96" font-size="12" class="dim" opacity="0.8">LEVEL</text>
  <text x="812" y="96" text-anchor="end" font-size="12" class="dim" opacity="0.8">%</text>

  <!-- row 1 -->
  <text x="46" y="129" font-size="15" class="fg">JavaScript · TypeScript</text>
  <rect x="312" y="118" width="430" height="13" rx="4" fill="#161B22" stroke="#21262D"/>
  <rect x="312" y="118" width="409" height="13" rx="4" fill="#4AF2C8" class="bar b0"/>
  <rect x="312" y="118" width="430" height="13" fill="url(#seg)"/>
  <text x="812" y="129" text-anchor="end" font-size="14" class="mint pct p0">95</text>

  <!-- row 2 -->
  <text x="46" y="166" font-size="15" class="fg">React · Next.js</text>
  <rect x="312" y="155" width="430" height="13" rx="4" fill="#161B22" stroke="#21262D"/>
  <rect x="312" y="155" width="387" height="13" rx="4" fill="#4AF2C8" class="bar b1"/>
  <rect x="312" y="155" width="430" height="13" fill="url(#seg)"/>
  <text x="812" y="166" text-anchor="end" font-size="14" class="mint pct p1">90</text>

  <!-- row 3 -->
  <text x="46" y="203" font-size="15" class="fg">HTML · CSS · Tailwind</text>
  <rect x="312" y="192" width="430" height="13" rx="4" fill="#161B22" stroke="#21262D"/>
  <rect x="312" y="192" width="404" height="13" rx="4" fill="#4AF2C8" class="bar b2"/>
  <rect x="312" y="192" width="430" height="13" fill="url(#seg)"/>
  <text x="812" y="203" text-anchor="end" font-size="14" class="mint pct p2">94</text>

  <!-- row 4 -->
  <text x="46" y="240" font-size="15" class="fg">UI/UX · Design Systems</text>
  <rect x="312" y="229" width="430" height="13" rx="4" fill="#161B22" stroke="#21262D"/>
  <rect x="312" y="229" width="366" height="13" rx="4" fill="#4AF2C8" class="bar b3"/>
  <rect x="312" y="229" width="430" height="13" fill="url(#seg)"/>
  <text x="812" y="240" text-anchor="end" font-size="14" class="mint pct p3">85</text>

  <!-- row 5 -->
  <text x="46" y="277" font-size="15" class="fg">Node.js · Express</text>
  <rect x="312" y="266" width="430" height="13" rx="4" fill="#161B22" stroke="#21262D"/>
  <rect x="312" y="266" width="335" height="13" rx="4" fill="#FFC46B" class="bar b4"/>
  <rect x="312" y="266" width="430" height="13" fill="url(#seg)"/>
  <text x="812" y="277" text-anchor="end" font-size="14" class="amber pct p4">78</text>

  <!-- row 6 -->
  <text x="46" y="314" font-size="15" class="fg">SQL · Postgres · Supabase</text>
  <rect x="312" y="303" width="430" height="13" rx="4" fill="#161B22" stroke="#21262D"/>
  <rect x="312" y="303" width="327" height="13" rx="4" fill="#FFC46B" class="bar b5"/>
  <rect x="312" y="303" width="430" height="13" fill="url(#seg)"/>
  <text x="812" y="314" text-anchor="end" font-size="14" class="amber pct p5">76</text>

  <!-- row 7 -->
  <text x="46" y="351" font-size="15" class="fg">PHP · REST APIs</text>
  <rect x="312" y="340" width="430" height="13" rx="4" fill="#161B22" stroke="#21262D"/>
  <rect x="312" y="340" width="318" height="13" rx="4" fill="#FFC46B" class="bar b6"/>
  <rect x="312" y="340" width="430" height="13" fill="url(#seg)"/>
  <text x="812" y="351" text-anchor="end" font-size="14" class="amber pct p6">74</text>

  <!-- row 8 -->
  <text x="46" y="388" font-size="15" class="fg">n8n · Automation · Git</text>
  <rect x="312" y="377" width="430" height="13" rx="4" fill="#161B22" stroke="#21262D"/>
  <rect x="312" y="377" width="361" height="13" rx="4" fill="#79C0FF" class="bar b7"/>
  <rect x="312" y="377" width="430" height="13" fill="url(#seg)"/>
  <text x="812" y="388" text-anchor="end" font-size="14" class="ice pct p7">84</text>

  <!-- status lines -->
  <text x="46" y="426" font-size="14" class="stat"><tspan class="dim">Tasks: </tspan><tspan class="fg">2 building</tspan><tspan class="dim">, </tspan><tspan class="fg">1 learning-sprint</tspan><tspan class="dim">, </tspan><tspan class="mint">∞ ideas</tspan></text>
  <text x="46" y="450" font-size="14" class="stat2"><tspan class="dim">Load avg: </tspan><tspan class="amber">coffee 2.05</tspan><tspan class="dim"> · </tspan><tspan class="ice">focus 1.80</tspan><tspan class="dim"> · </tspan><tspan class="mint">deploys 0.99</tspan></text>
  <text x="814" y="450" text-anchor="end" font-size="14" class="stat2"><tspan class="dim">Uptime: </tspan><tspan class="fg">10+ yrs</tspan></text>
</svg>
