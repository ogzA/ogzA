<?xml version="1.0" encoding="UTF-8"?>
<svg width="860" height="400" viewBox="0 0 860 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Oğuz Akankan · Full-Stack Developer">
  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4AF2C8"/>
      <stop offset="1" stop-color="#FFC46B"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4AF2C8" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#4AF2C8"/>
      <stop offset="0.75" stop-color="#FFC46B"/>
      <stop offset="1" stop-color="#FFC46B" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4AF2C8" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#4AF2C8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="6" height="4" patternUnits="userSpaceOnUse">
      <rect width="6" height="1" fill="#FFFFFF" fill-opacity="0.025"/>
    </pattern>
    <clipPath id="body">
      <rect x="8" y="60" width="844" height="332" rx="0"/>
    </clipPath>
  </defs>

  <style><![CDATA[
    text { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace; }
    .dim   { fill:#8B949E; }
    .fg    { fill:#E6EDF3; }
    .mint  { fill:#4AF2C8; }
    .amber { fill:#FFC46B; }
    .ice   { fill:#79C0FF; }

    .type-cover {
      transform-box: fill-box;
      transform-origin: 100% 50%;
      animation: wipe 1.15s steps(22, end) 0.55s forwards;
    }
    @keyframes wipe { to { transform: scaleX(0); } }

    .rise {
      opacity: 0;
      animation: riseIn 0.75s cubic-bezier(.2,.7,.2,1) 1.85s forwards;
    }
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .fade { opacity: 0; animation: fadeIn 0.5s ease-out forwards; }
    .d1 { animation-delay: 2.45s; }
    .d2 { animation-delay: 2.75s; }
    .d3 { animation-delay: 3.15s; }
    @keyframes fadeIn { to { opacity: 1; } }

    .cursor { animation: blink 1.1s infinite; }
    @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }

    .drift  { animation: driftUp 18s linear infinite; }
    .drift2 { animation: driftUp 26s linear infinite reverse; }
    .drift3 { animation: driftUp 22s linear infinite; }
    @keyframes driftUp { from { transform: translateY(0); } to { transform: translateY(-320px); } }
  ]]></style>

  <!-- window shell -->
  <rect x="6" y="6" width="848" height="388" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>

  <!-- title bar -->
  <circle cx="34" cy="32" r="7" fill="#FF5F57"/>
  <circle cx="58" cy="32" r="7" fill="#FEBC2E"/>
  <circle cx="82" cy="32" r="7" fill="#28C840"/>
  <text x="430" y="37" text-anchor="middle" font-size="13" class="dim">oguz@akankan: ~/portfolio</text>
  <text x="826" y="37" text-anchor="end" font-size="12" class="dim" opacity="0.7">zsh · v2026</text>
  <line x1="7" y1="58" x2="853" y2="58" stroke="#21262D" stroke-width="1"/>
  <rect x="7" y="58" width="846" height="2" fill="url(#accentLine)" opacity="0.55"/>

  <!-- body deco -->
  <g clip-path="url(#body)">
    <ellipse cx="310" cy="185" rx="320" ry="95" fill="url(#glow)"/>

    <!-- drifting glyph columns -->
    <g transform="translate(660,70)" opacity="0.06">
      <g class="drift" fill="#4AF2C8" font-size="15">
        <text y="0">{</text><text y="40">}</text><text y="80">λ</text><text y="120">=&gt;</text>
        <text y="160">0</text><text y="200">1</text><text y="240">&lt;/&gt;</text><text y="280">*</text>
        <text y="320">{</text><text y="360">}</text><text y="400">λ</text><text y="440">=&gt;</text>
        <text y="480">0</text><text y="520">1</text><text y="560">&lt;/&gt;</text><text y="600">*</text>
      </g>
    </g>
    <g transform="translate(740,110)" opacity="0.05">
      <g class="drift2" fill="#FFC46B" font-size="15">
        <text y="0">;</text><text y="40">::</text><text y="80">$</text><text y="120">#</text>
        <text y="160">()</text><text y="200">[]</text><text y="240">~</text><text y="280">&amp;&amp;</text>
        <text y="320">;</text><text y="360">::</text><text y="400">$</text><text y="440">#</text>
        <text y="480">()</text><text y="520">[]</text><text y="560">~</text><text y="600">&amp;&amp;</text>
      </g>
    </g>
    <g transform="translate(806,90)" opacity="0.045">
      <g class="drift3" fill="#79C0FF" font-size="15">
        <text y="0">1</text><text y="40">0</text><text y="80">1</text><text y="120">1</text>
        <text y="160">0</text><text y="200">0</text><text y="240">1</text><text y="280">0</text>
        <text y="320">1</text><text y="360">0</text><text y="400">1</text><text y="440">1</text>
        <text y="480">0</text><text y="520">0</text><text y="560">1</text><text y="600">0</text>
      </g>
    </g>

    <rect x="8" y="60" width="844" height="332" fill="url(#scan)"/>
  </g>

  <!-- line 1: typed command -->
  <text x="46" y="112" font-size="17"><tspan class="mint">oguz@akankan</tspan><tspan class="dim">:~$</tspan><tspan class="fg"> whoami</tspan></text>
  <!--cover--><rect x="42" y="94" width="272" height="26" fill="#0D1117" class="type-cover"/>

  <!-- name -->
  <text x="44" y="198" font-size="60" font-weight="700" letter-spacing="-1.5" fill="url(#nameGrad)" class="rise">Oğuz Akankan</text>

  <!-- subtitles -->
  <text x="46" y="242" font-size="18" class="fade d1"><tspan class="amber">&gt;</tspan><tspan class="fg"> Full-Stack Developer</tspan><tspan class="dim"> · UI/UX craftsman</tspan></text>
  <text x="46" y="276" font-size="18" class="fade d2"><tspan class="amber">&gt;</tspan><tspan class="dim"> Wuppertal, Germany · 10+ years of turning coffee into clean code</tspan></text>

  <!-- final prompt with blinking cursor -->
  <g class="fade d3">
    <text x="46" y="342" font-size="17"><tspan class="mint">oguz@akankan</tspan><tspan class="dim">:~$</tspan></text>
    <rect x="216" y="326" width="11" height="21" fill="#4AF2C8" class="cursor"/>
  </g>
</svg>
